# EduBattle Production Nginx Configuration
# WebSocket (Live Battle & Online Tracker) + Static Caching + SSL

server {
    listen 80;
    server_name _; # O'zingizning domeningizni yoki server IP sini yozing

    client_max_body_size 100M;

    # Gzip siqish (sayt tez ochilishi uchun)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket qo'llab-quvvatlash (Jonli Battle va Online Tracker uchun shart!)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Statik fayllarni kesh qilish
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
